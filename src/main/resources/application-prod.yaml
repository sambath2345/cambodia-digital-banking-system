spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    hikari:
      maximumPoolSize: ${DB_POOL_MAX_SIZE:30}
      minimumIdle: ${DB_POOL_MIN_IDLE:5}
  file-upload:
    server-path: ${FILE_UPLOAD_PATH:/app/uploads/}
    base-uri: ${FILE_UPLOAD_BASE_URI}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: warn
