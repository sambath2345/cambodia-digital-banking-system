server:
  port: ${SERVER_PORT:8888}
  forward-headers-strategy: framework

spring:
  profiles:
    default: dev
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  application:
    name: cambodia-digital-banking-system

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    hikari:
      connectionTimeout: 30000
      initializationFailTimeout: 3000
      validationTimeout: 5000
      maxLifetime: 1800000
      maximumPoolSize: 30
      minimumIdle: 10
      idleTimeout: 600000
      registerMbeans: false
      poolName: service-connection-pool

  flyway:
    enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 10
        jdbc:
          batch_size: 100
        order_updates: true
        order_inserts: true

